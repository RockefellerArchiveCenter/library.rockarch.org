<div id="modal__date" class="modal__overlay" aria-hidden="true">
  <div data-micromodal-close>
    <div class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 id="modalTitle" class="modal__header-title">Request in Reading Room</h2>
        <button class="modal__header-button" aria-label="Close" data-micromodal-close>
          <span class="material-icon" aria-hidden="true">close</span>
        </button>
      </div>
      <div class="modal__body">
        <h3>Request "{{ page.item_title }}"</h3>
        <form method="post" action="https://raccess.rockarch.org/aeon.dll">
          <div class="modal-form__input-group">
            <input type="hidden" name="AeonForm" value="EADRequest">
            <input type="hidden" name="WebRequestForm" value="DefaultRequest">
            <input type="hidden" name="RequestType" value="Loan">
            <input type="hidden" name="DocumentType" value="Default">
            <input type="hidden" name="SubmitButton" value="Submit Request">
            <input type="hidden" name="UserReview" value="No">
            <!-- Item inputs -->
            <input type="hidden" name="Request" value="{{page.permalink}}">
            <input type="hidden" name="ItemDate" value="{% include publication_info.html object=include.object %}">
            <input type="hidden" name="ItemTitle" value="{{page.item_title | replace: '"', "'"}}">
            <input type="hidden" name="ItemAuthor" value="{% include author_list.html object=include.object separator=', ' %}">
            <input type="hidden" name="CallNumber" value="{% include call_number.html object=include.object %}">
            <input type="hidden" name="ItemInfo3" value="{{site.url}}/items/{{page.id}}/">
            <div class="modal-form__input input">
              <label for="datepicker">Scheduled date of visit (mm/dd/yyyy) *</label>
              <input type="text" id="datepicker" name="ScheduledDate" pattern="\d{1,2}/\d{1,2}/\d{4}" required=required />
            </div>
            <div class="modal-form__buttons">
              <button type="submit" class="btn btn--sm btn--orange">Request Item</button>
              <button type="reset" class="btn btn--sm btn--gray" data-micromodal-close>Cancel</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
document.querySelector('input[name="ItemTitle"]').value
document.querySelector('.modal__body h3').textContent
document.querySelector('.item__header h1').textContent.trim()
